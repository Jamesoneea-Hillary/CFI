<!DOCTYPE html>
<html>
<head>
    <title>CFI Admin Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            display: flex;
            min-height: 100vh;
            background: #f4f6f9;
        }

        .sidebar {
            width: 260px;
            background: #1e1e2f;
            color: white;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: #ccc;
            padding: 10px;
            text-decoration: none;
            border-radius: 6px;
        }

        .sidebar a:hover {
            background: #2c2c44;
            color: white;
        }

        .main {
            flex: 1;
            padding: 20px;
        }

        .brand {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="brand">🌍 CFI Admin</div>

    <a href="/dashboard/"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/news/"><i class="bi bi-newspaper"></i> News</a>
    <a href="/donations/"><i class="bi bi-cash-stack"></i> Donations</a>
    <a href="/work/"><i class="bi bi-briefcase"></i> Work</a>
    <a href="/contacts/"><i class="bi bi-envelope"></i> Contacts</a>
</div>

<!-- MAIN CONTENT -->
<div class="main">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
